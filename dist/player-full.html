<script>
window.GUE=window.GUE||{};
window.GUE = window.GUE || {};
/* ui/font.js — 8x8 chunky bitmap font (NES feel), full printable ASCII + UI glyphs.
   Glyph cell is 6px of ink in an 8px advance; row byte, leftmost column = bit 7.
   Generated from ASCII-art grids; data is 8 bytes per glyph, codes 0x20..0x7E
   followed by the extras listed in GUE.font.EXTRA. */
(function () {
  var W = 8, H = 8, FIRST = 32, LAST = 126;
  var EXTRA = "▼►◄▲•"; // \u25BC \u25BA \u25C4 \u25B2 \u2022
  var DATA = [
    '000000000000000030303030003000006c6c0000000000002828fc28fc2828002078a07028f02000c4c810204c8c00006090a040a89068003030000000000000',
    '183020202030180060301010103060000020a870a8200000002020f8202000000000000000302040000000f80000000000000000003030000808102040808000',
    '708898a8c88870002060202020207000708808102040f800f81030080888700010305090f8101000f880f00808887000304080f088887000f808102040404000',
    '708888708888700070888878081060000030300030300000003030003020400010204080402010000000f800f800000040201008102040007088081020002000',
    '7088b8a8b880700020508888f8888800f08888f08888f0007088808080887000e09088888890e000f88080f08080f800f88080f080808000708880b888887000',
    '888888f888888800702020202020700038101010109060008890a0c0a0908800808080808080f80088d8a8a88888880088c8c8a8989888007088888888887000',
    'f08888f08080800070888888a8906800f08888f0a0908800788080700808f000f82020202020200088888888888870008888888888502000888888a8a8d88800',
    '88885020508888008888502020202000f80810204080f80038202020202038008080402010080800e02020202020e000205088000000000000000000000000f8',
    '402000000000000000007008788878008080f0888888f0000000708880887000080878888888780000007088f8807000304840f0404040000000788888780870',
    '8080f0888888880020006020202070001000301010109060808090a0c0a0900060202020202070000000d0a8a88888000000f088888888000000708888887000',
    '0000f08888f0808000007888887808080000b0c880808000000078807008f0004040f040404830000000888888887800000088888850200000008888a8a85000',
    '000088502050880000008888887808700000f8102040f800182020602020180020202020202020006010101810106000000064980000000000fc787830300000',
    'c0e0f0f8f0e0c0000c1c3c7c3c1c0c000030307878fc00000000307878300000'
  ].join('');

  var N = (LAST - FIRST + 1) + EXTRA.length;
  // glyph index -> Uint8Array(8) of row bitmaps
  var GLYPHS = new Array(N);
  for (var g = 0; g < N; g++) {
    var rows = new Uint8Array(8);
    for (var r = 0; r < 8; r++) rows[r] = parseInt(DATA.substr(g * 16 + r * 2, 2), 16);
    GLYPHS[g] = rows;
  }

  function index(ch) {
    var c = ch.charCodeAt(0);
    if (c >= FIRST && c <= LAST) return c - FIRST;
    var e = EXTRA.indexOf(ch);
    if (e >= 0) return (LAST - FIRST + 1) + e;
    return -1; // unmapped: rendered as blank (never as garbage)
  }

  // Per-color glyph atlas: one offscreen strip built lazily, then blitted.
  // Keeps a full 240x72 text page at ~250 drawImage calls instead of ~4000 fillRects.
  var atlases = {};
  function atlas(color) {
    var a = atlases[color];
    if (a) return a;
    if (typeof document === 'undefined') return null;
    var cv = document.createElement('canvas');
    cv.width = N * W; cv.height = H;
    var c = cv.getContext('2d');
    c.fillStyle = color;
    for (var g = 0; g < N; g++) {
      var rows = GLYPHS[g];
      for (var y = 0; y < 8; y++) {
        var b = rows[y];
        if (!b) continue;
        var run = -1;
        for (var x = 0; x <= 8; x++) {
          var on = x < 8 && (b & (0x80 >> x));
          if (on && run < 0) run = x;
          else if (!on && run >= 0) { c.fillRect(g * W + run, y, x - run, 1); run = -1; }
        }
      }
    }
    atlases[color] = cv;
    return cv;
  }

  function draw(ctx, str, x, y, color) {
    if (!ctx || str == null) return x;
    str = String(str);
    var a = atlas(color || '#ffffff');
    if (!a) return x + str.length * W;
    for (var i = 0; i < str.length; i++) {
      var gi = index(str[i]);
      if (gi >= 0 && str[i] !== ' ') ctx.drawImage(a, gi * W, 0, W, H, x + i * W, y, W, H);
    }
    return x + str.length * W;
  }

  // Centered helper — used constantly by the shell's button labels.
  function drawCentered(ctx, str, cx, y, color) {
    return draw(ctx, str, Math.round(cx - measure(str) / 2), y, color);
  }

  function measure(str) { return String(str == null ? '' : str).length * W; }

  GUE.font = {
    W: W, H: H, EXTRA: EXTRA,
    DOWN: EXTRA[0], RIGHT: EXTRA[1], LEFT: EXTRA[2], UP: EXTRA[3], DOT: EXTRA[4],
    draw: draw, drawCentered: drawCentered, measure: measure,
    glyph: function (ch) { var i = index(ch); return i < 0 ? null : GLYPHS[i]; }
  };
})();

window.GUE = window.GUE || {};
/* art/kit.js — NES palette + pixel drawing primitives + shared scene props.
 * Scene window is 144x104; every prop here is sized for that box.
 * STYLE LAW: black outlines, dithered shading, no gradients, horizon ~y=36
 * outdoors, floor line ~y=80 indoors/caves.
 */
(function () {
  'use strict';

  var GUE = window.GUE;
  var SCENE_W = 144, SCENE_H = 104;

  /* ---------------------------------------------------------------- palette
   * Canonical 64-entry Ricoh 2C02 table. Indices are the real NES $00..$3F.
   * Named conveniences are aliases onto those same strings — use the names.
   */
  var PAL = {
    0x00: '#7C7C7C', 0x01: '#0000FC', 0x02: '#0000BC', 0x03: '#4428BC',
    0x04: '#940084', 0x05: '#A80020', 0x06: '#A81000', 0x07: '#881400',
    0x08: '#503000', 0x09: '#007800', 0x0A: '#006800', 0x0B: '#005800',
    0x0C: '#004058', 0x0D: '#000000', 0x0E: '#000000', 0x0F: '#000000',

    0x10: '#BCBCBC', 0x11: '#0078F8', 0x12: '#0058F8', 0x13: '#6844FC',
    0x14: '#D800CC', 0x15: '#E40058', 0x16: '#F83800', 0x17: '#E45C10',
    0x18: '#AC7C00', 0x19: '#00B800', 0x1A: '#00A800', 0x1B: '#00A844',
    0x1C: '#008888', 0x1D: '#000000', 0x1E: '#000000', 0x1F: '#000000',

    0x20: '#F8F8F8', 0x21: '#3CBCFC', 0x22: '#6888FC', 0x23: '#9878F8',
    0x24: '#F878F8', 0x25: '#F85898', 0x26: '#F87858', 0x27: '#FCA044',
    0x28: '#F8B800', 0x29: '#B8F818', 0x2A: '#58D854', 0x2B: '#58F898',
    0x2C: '#00E8D8', 0x2D: '#787878', 0x2E: '#000000', 0x2F: '#000000',

    0x30: '#FCFCFC', 0x31: '#A4E4FC', 0x32: '#B8B8F8', 0x33: '#D8B8F8',
    0x34: '#F8B8F8', 0x35: '#F8A4C0', 0x36: '#F0D0B0', 0x37: '#FCE0A8',
    0x38: '#F8D878', 0x39: '#D8F878', 0x3A: '#B8F8B8', 0x3B: '#B8F8D8',
    0x3C: '#00FCFC', 0x3D: '#F8D8F8', 0x3E: '#000000', 0x3F: '#000000'
  };

  /* named conveniences (contract-locked names first) */
  PAL.BLACK     = PAL[0x0F];  // $0F
  PAL.WHITE     = PAL[0x30];  // $30
  PAL.SKY       = PAL[0x21];  // $21 pale NES sky
  PAL.GRASS     = PAL[0x2A];  // $2A
  PAL.TREE      = PAL[0x1A];  // $1A foliage mid
  PAL.DIRT      = PAL[0x18];  // $18
  PAL.BROWN     = PAL[0x08];  // $08 dark wood
  PAL.STONE     = PAL[0x10];  // $10
  PAL.STONE_DK  = PAL[0x00];  // $00
  PAL.WATER     = PAL[0x11];  // $11
  PAL.WATER_DK  = PAL[0x02];  // $02
  PAL.TORCH     = PAL[0x27];  // $27 flame orange
  PAL.FIRE      = PAL[0x16];  // $16 flame red
  PAL.CRIMSON   = PAL[0x05];  // $05
  PAL.GOLD      = PAL[0x28];  // $28
  PAL.GREY      = PAL[0x2D];  // $2D
  PAL.TAN       = PAL[0x37];  // $37
  PAL.PURPLE    = PAL[0x23];  // $23
  PAL.GREEN_DK  = PAL[0x0A];  // $0A

  /* extra conveniences (additive — never remove the above) */
  PAL.SKY_LT    = PAL[0x31];
  PAL.GRASS_DK  = PAL[0x1A];
  PAL.GRASS_LT  = PAL[0x29];
  PAL.WOOD      = PAL[0x17];  // light wood / plank highlight
  PAL.WOOD_DK   = PAL[0x07];
  PAL.WATER_LT  = PAL[0x21];
  PAL.PURPLE_DK = PAL[0x03];
  PAL.MAGENTA   = PAL[0x14];
  PAL.PINK      = PAL[0x35];
  PAL.CYAN      = PAL[0x2C];
  PAL.TEAL      = PAL[0x1C];
  PAL.SILVER    = PAL[0x10];
  PAL.BONE      = PAL[0x37];
  PAL.RED       = PAL[0x16];
  PAL.BLUE      = PAL[0x11];
  PAL.OLIVE     = PAL[0x18];

  /* --------------------------------------------------------- primitives */

  function px(ctx, x, y, c) {
    ctx.fillStyle = c;
    ctx.fillRect(x | 0, y | 0, 1, 1);
  }

  function rect(ctx, x, y, w, h, c) {
    if (w <= 0 || h <= 0) return;
    ctx.fillStyle = c;
    ctx.fillRect(x | 0, y | 0, w | 0, h | 0);
  }

  function frame(ctx, x, y, w, h, c) {
    if (w <= 0 || h <= 0) return;
    x |= 0; y |= 0; w |= 0; h |= 0;
    ctx.fillStyle = c;
    ctx.fillRect(x, y, w, 1);
    ctx.fillRect(x, y + h - 1, w, 1);
    ctx.fillRect(x, y, 1, h);
    ctx.fillRect(x + w - 1, y, 1, h);
  }

  function hline(ctx, x, y, w, c) { rect(ctx, x, y, w, 1, c); }
  function vline(ctx, x, y, h, c) { rect(ctx, x, y, 1, h, c); }

  /* 50% checkerboard. c1 is the base, c2 the speckle. */
  function dither(ctx, x, y, w, h, c1, c2) {
    x |= 0; y |= 0; w |= 0; h |= 0;
    if (w <= 0 || h <= 0) return;
    if (c1) rect(ctx, x, y, w, h, c1);
    ctx.fillStyle = c2;
    for (var r = 0; r < h; r++) {
      for (var c = (r & 1); c < w; c += 2) ctx.fillRect(x + c, y + r, 1, 1);
    }
  }

  /* 25% speckle — lighter shading than a full checker. */
  function dither25(ctx, x, y, w, h, c1, c2) {
    x |= 0; y |= 0; w |= 0; h |= 0;
    if (w <= 0 || h <= 0) return;
    if (c1) rect(ctx, x, y, w, h, c1);
    ctx.fillStyle = c2;
    for (var r = 0; r < h; r++) {
      for (var c = (r & 1) * 2; c < w; c += 4) ctx.fillRect(x + c, y + r, 1, 1);
    }
  }

  /* grid: array of equal-length strings; each char is a palMap key.
   * '.' and ' ' are transparent. Scale 1: one char = one pixel. */
  function sprite(ctx, grid, x, y, palMap) {
    if (!grid || !grid.length) return;
    var map = palMap || {}, byCol = {}, r, row, n, c0, end, ch, col, a, i;
    x |= 0; y |= 0;
    for (r = 0; r < grid.length; r++) {
      row = grid[r]; n = row.length; c0 = 0;
      while (c0 < n) {
        ch = row.charAt(c0);
        end = c0 + 1;
        while (end < n && row.charAt(end) === ch) end++;
        if (ch !== '.' && ch !== ' ') {
          col = map[ch];
          if (col) (byCol[col] || (byCol[col] = [])).push(c0, r, end - c0);
        }
        c0 = end;
      }
    }
    for (col in byCol) {
      if (!Object.prototype.hasOwnProperty.call(byCol, col)) continue;
      a = byCol[col];
      ctx.fillStyle = col;
      for (i = 0; i < a.length; i += 3) ctx.fillRect(x + a[i], y + a[i + 1], a[i + 2], 1);
    }
  }

  /* filled circle, integer raster (no antialiasing anywhere in this kit) */
  function disc(ctx, cx, cy, r, c) {
    ctx.fillStyle = c;
    for (var dy = -r; dy <= r; dy++) {
      var span = Math.floor(Math.sqrt(r * r - dy * dy));
      if (span < 0) continue;
      ctx.fillRect((cx - span) | 0, (cy + dy) | 0, span * 2 + 1, 1);
    }
  }

  /* upward-pointing triangle with apex at (cx, y), base halfw at y+rows-1 */
  function tri(ctx, cx, y, halfw, rows, c) {
    ctx.fillStyle = c;
    for (var i = 0; i < rows; i++) {
      var hw = Math.round(halfw * (i + 1) / rows);
      ctx.fillRect((cx - hw) | 0, (y + i) | 0, hw * 2 + 1, 1);
    }
  }

  /* deterministic hash -> [0,1). Same room always looks the same. */
  function hash(a, b) {
    var n = (((a | 0) * 374761393) + ((b | 0) * 668265263)) >>> 0;
    n = Math.imul(n ^ (n >>> 13), 1274126177) >>> 0;
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }

  /* scattered single pixels — grit, pebbles, stars, sand */
  function noise(ctx, x, y, w, h, c, density, seed) {
    ctx.fillStyle = c;
    seed = seed | 0;
    for (var r = 0; r < h; r++) {
      for (var cc = 0; cc < w; cc++) {
        if (hash(x + cc + seed * 71, y + r - seed * 31) < density) {
          ctx.fillRect(x + cc, y + r, 1, 1);
        }
      }
    }
  }

  /* jagged 1px crack walking downward from (x,y) */
  function crack(ctx, x, y, len, c, seed) {
    ctx.fillStyle = c;
    var cx = x;
    for (var i = 0; i < len; i++) {
      ctx.fillRect(cx | 0, (y + i) | 0, 1, 1);
      var h = hash(cx + seed * 17, y + i + seed * 5);
      if (h < 0.3) cx -= 1; else if (h > 0.72) cx += 1;
      if (h > 0.94) ctx.fillRect((cx + 1) | 0, (y + i) | 0, 1, 1);
    }
  }

  /* ------------------------------------------------------------ backdrops */

  function cloud(ctx, x, y, big) {
    var M = { w: PAL.WHITE, S: PAL.SKY_LT };
    var g = big ? [
      '.....wwwwww.....',
      '...wwwwwwwwww...',
      '.wwwwwwwwwwwwww.',
      'wwwwwwwwwwwwwwww',
      '.SSSSSSSSSSSSSS.'
    ] : [
      '...wwwww..',
      '.wwwwwwwww',
      '.SSSSSSSS.'
    ];
    sprite(ctx, g, x, y, M);
  }

  /* Fills y 0..36 with sky + a couple of clouds. Static (t accepted, unused
   * for motion — NES skies don't scroll and determinism keeps tests sane). */
  function sky(ctx, t) {
    rect(ctx, 0, 0, SCENE_W, 26, PAL.SKY);
    dither(ctx, 0, 26, SCENE_W, 4, PAL.SKY, PAL.SKY_LT);
    rect(ctx, 0, 30, SCENE_W, 7, PAL.SKY_LT);
    cloud(ctx, 12, 6, 1);
    cloud(ctx, 96, 15, 0);
  }

  /* Night/cave sky: near-black with a stone lip. */
  function nightSky(ctx) {
    rect(ctx, 0, 0, SCENE_W, 37, PAL.BLACK);
    dither25(ctx, 0, 0, SCENE_W, 20, null, PAL[0x02]);
  }

  /* Ground band from y down to the bottom of the scene window. */
  function grass(ctx, y, w) {
    w = w || SCENE_W;
    var h = SCENE_H - y;
    if (h <= 0) return;
    rect(ctx, 0, y, w, h, PAL.GRASS);
    dither(ctx, 0, y, w, 3, PAL.GRASS, PAL.GRASS_DK);          // horizon haze
    dither25(ctx, 0, y + h - 14, w, 14, null, PAL.GRASS_LT);   // near-ground light
    for (var x = 1; x < w - 2; x += 5) {
      var j = hash(x, y);
      var ty = y + 4 + Math.floor(j * (h - 6));
      if (ty > SCENE_H - 2) continue;
      px(ctx, x + (j > 0.5 ? 1 : 0), ty, PAL.GREEN_DK);
      px(ctx, x + 1, ty - 1, PAL.GREEN_DK);
      px(ctx, x + 2, ty, PAL.GREEN_DK);
      if (j > 0.66) px(ctx, x + 1, ty - 2, PAL.GRASS_LT);
    }
  }

  /* Cave/room floor band from y down to the bottom. */
  function cavefloor(ctx, y, w) {
    w = w || SCENE_W;
    var h = SCENE_H - y;
    if (h <= 0) return;
    rect(ctx, 0, y, w, h, PAL.STONE_DK);
    hline(ctx, 0, y, w, PAL.BLACK);
    dither(ctx, 0, y + 1, w, 4, PAL.STONE_DK, PAL.BLACK);      // recede into dark
    dither25(ctx, 0, y + h - 12, w, 12, null, PAL.STONE);      // near floor catches light
    for (var i = 0; i < 26; i++) {
      var px0 = Math.floor(hash(i * 13, y) * (w - 4)) + 2;
      var py0 = y + 5 + Math.floor(hash(i * 7, y + 3) * (h - 7));
      if (py0 >= SCENE_H - 1) continue;
      px(ctx, px0, py0, PAL.STONE);
      px(ctx, px0 + 1, py0, PAL.GREY);
      px(ctx, px0, py0 + 1, PAL.BLACK);
    }
  }

  /* Rock ceiling with stalactites across the top of the scene. */
  function caveCeiling(ctx, w) {
    w = w || SCENE_W;
    dither(ctx, 0, 0, w, 9, PAL.STONE_DK, PAL.GREY);
    hline(ctx, 0, 9, w, PAL.BLACK);
    for (var x = 3; x < w - 4; x += 9) {
      var len = 3 + Math.floor(hash(x, 99) * 9);
      var hw = 2 + (hash(x, 7) > 0.6 ? 1 : 0);
      for (var i = 0; i < len; i++) {
        var t = 1 - i / len;
        var half = Math.max(0, Math.round(hw * t));
        rect(ctx, x - half, 10 + i, half * 2 + 1, 1, PAL.STONE_DK);
        px(ctx, x - half - 1, 10 + i, PAL.BLACK);
        px(ctx, x + half + 1, 10 + i, PAL.BLACK);
        if (i < len - 2) px(ctx, x - half, 10 + i, PAL.STONE);
      }
      px(ctx, x, 10 + len, PAL.BLACK);
    }
  }

  /* ---------------------------------------------------------------- props */

  /* Cave wall texture: dithered greys + crack lines + shadow blotches. */
  function rockWall(ctx, x, y, w, h) {
    if (w <= 0 || h <= 0) return;
    dither(ctx, x, y, w, h, PAL.STONE_DK, PAL.STONE);
    hline(ctx, x, y, w, PAL.STONE);                    // lit top lip
    hline(ctx, x, y + h - 1, w, PAL.BLACK);
    var i, bx, by, bw, bh;
    for (i = 0; i < 5; i++) {                          // shadow blotches
      bx = x + Math.floor(hash(x + i * 31, y) * Math.max(1, w - 10));
      by = y + Math.floor(hash(y + i * 17, x) * Math.max(1, h - 8));

//
//  A .folio must open in a page with no build step and no library download — the
//  portability promise collapses the moment playing a game requires npm. So this
//  reads the container using only what a browser already has: DataView for the
//  headers and DecompressionStream for the payloads.
//
//  Deliberately read-only. Packing is an authoring operation and belongs in the
//  CLI; a player that could also write archives is a larger attack surface for no
//  benefit to the person playing.

  const EOCD_SIG = 0x06054b50;

   * @param {ArrayBuffer|Uint8Array} input
   * @returns {Promise<Object<string, Uint8Array>>}
   */
  async function readFolio(input) {
    const bytes = input instanceof Uint8Array ? input : new Uint8Array(input);
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

    // Scan back for the end-of-central-directory record. The comment field can be
    // up to 64KB, so the scan is bounded rather than unbounded.
    let eocd = -1;
    const floor = Math.max(0, bytes.length - 65558);
    for (let i = bytes.length - 22; i >= floor; i--) {
      if (view.getUint32(i, true) === EOCD_SIG) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('not a .folio: no end-of-central-directory record');

    const count = view.getUint16(eocd + 10, true);
    let p = view.getUint32(eocd + 16, true);
    const out = {};

    for (let i = 0; i < count; i++) {
      if (view.getUint32(p, true) !== CDIR_SIG) throw new Error('corrupt central directory');
      const method = view.getUint16(p + 10, true);
      const compSize = view.getUint32(p + 20, true);
      const nameLen = view.getUint16(p + 28, true);
      const extraLen = view.getUint16(p + 30, true);
      const commentLen = view.getUint16(p + 32, true);
      const localOff = view.getUint32(p + 42, true);
      const name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nameLen));

      // The local header repeats the name and extra lengths, and they may differ
      // from the central directory's, so the data offset must come from the local
      // header or entries silently decode as garbage.
      const lNameLen = view.getUint16(localOff + 26, true);
      const lExtraLen = view.getUint16(localOff + 28, true);
      const start = localOff + 30 + lNameLen + lExtraLen;
      const body = bytes.subarray(start, start + compSize);

      out[name] = method === 0 ? body : await inflateRaw(body);
      p += 46 + nameLen + extraLen + commentLen;
    }
    return out;
  }

    if (typeof DecompressionStream !== 'function') {
      throw new Error('this browser cannot decompress .folio entries (no DecompressionStream)');
    }
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());

    // Confirm the loaded story file is the one roommap.js was calibrated against:
    // every mapped z-object must still carry the short name we matched it by.

      return {
        rooms: Object.keys(GUE.ROOMMAP).length,
        objects: Object.keys(GUE.OBJMAP).length,
        adventurer: GUE.ADVENTURER,

//  @folio/world — Path B logic backend: a declarative world interpreter.
//
//  Runs a world.json directly. This is how a story that was never a game becomes
//  one: there is no compiler and no scripting language, only data. A .folio can
//  therefore never contain executable code, which is a security property worth
//  advertising and the reason a game is safe to open from a stranger.
//
//  Deliberately less expressive than ZIL or Inform. A bounded model is what makes
//  generation reliable and validation tractable: because every effect comes from a
//  closed vocabulary, the validator can see statically everything a game can ever
//  do. When the vocabulary genuinely cannot express something the community needs,
//  it grows in a spec revision — with conformance fixtures keeping old games alive.
//
//  It emits the same World State Contract as @folio/zmachine. That is the whole
//  point: one shell, two backends, and a cross-path parity suite to keep them
//  honest as both evolve.

'use strict';

const DIRS = ['NORTH', 'SOUTH', 'EAST', 'WEST', 'NE', 'NW', 'SE', 'SW', 'UP', 'DOWN', 'IN', 'OUT'];

class World {
  constructor(world, opts) {
    opts = opts || {};
    this.def = world;
    this.rng = mulberry32(opts.seed !== undefined ? opts.seed : (world.meta && world.meta.seed) || 1);

    this.rooms = index(world.rooms);
    this.items = index(world.items);
    this.actors = index(world.actors || []);
    this.rules = world.rules || [];
    this.timers = (world.timers || []).map(t => Object.assign({ elapsed: 0 }, t));

    this.flags = Object.assign({}, world.flags);
    // Numbers. Flags are booleans, and without counters an author has no way to
    // say "the third time" except by chaining near-identical rules and reading
    // trip number out of flag state. That was the workaround the first cold build
    // reached for, and it called it out as the idiom nothing had taught it.
    this.counters = Object.assign({}, world.counters);
    this.here = world.meta.start;
    this.moves = 0;
    this.score = 0;
    this.ended = null;             // null | {win:boolean, reason:string}
    this.visited = new Set([this.here]);

    // Live location per item: room id, 'PLAYER', or a container's id.
    this.loc = {};
    for (const it of world.items) this.loc[it.id] = it.location;
    this.actorLoc = {};
    for (const a of (world.actors || [])) this.actorLoc[a.id] = a.location;

    this.log = [];
  }

  // -------------------------------------------------------------- contract
  /** Project into the World State Contract — identical shape to @folio/zmachine. */
  state() {
    const room = this.rooms[this.here] || {};
    const objects = [];
    const contents = {};
    const flags = {};

    for (const id of Object.keys(this.loc)) {
      const where = this.loc[id];
      const item = this.items[id];
      if (!item) continue;
      if (where === this.here) {
        objects.push(id);
        flags[id] = this.flagsOf(id);
      } else if (this.items[where] && this.loc[where] === this.here && this.isOpen(where)) {
        // One level into open containers, matching the Z-machine projection.
        objects.push(id);
        flags[id] = this.flagsOf(id);
        (contents[where] = contents[where] || []).push(id);
      }
    }
    for (const id of Object.keys(this.actorLoc)) {
      if (this.actorLoc[id] === this.here) { objects.push(id); flags[id] = this.flagsOf(id); }
    }

    const inventory = Object.keys(this.loc).filter(id => this.loc[id] === 'PLAYER');
    for (const id of inventory) flags[id] = this.flagsOf(id);

    return {
      roomId: this.here,
      roomName: room.name || this.here,
      score: this.score,
      moves: this.moves,
      dark: this.isDark(),
      objects,
      inventory,
      contents,
      flags,
      exits: this.exits(),
      // Counters live alongside flags in globals rather than in a key of their
      // own, because the contract has to look identical on both paths and a
      // Z-machine game has no counters to report.
      globals: Object.assign({}, this.flags, this.counters),
      fighting: objects.some(id => this.actors[id] && this.actors[id].hostile),
      lampTurns: this.lampTurns()
    };
  }

  /**
   * Live exits, keyed by direction. Three states, not two:
   *   "ROOM-ID"  passable now
   *   false      the passage exists but is blocked (locked door, boarded window)
   *   absent     no passage in that direction at all
   *
   * The middle state is the one worth having: it lets the compass grey out a door
   * the player can see but cannot yet use, which is information the player needs.
   * Path A emits it natively (Zork's boarded front door reports EAST: false), and
   * cross-path parity is what surfaced that Path B was collapsing it. An author who
   * genuinely wants a passage concealed marks the exit `hidden` and it disappears
   * entirely until its condition is met.
   */
  exits() {
    const room = this.rooms[this.here];
    const out = {};
    if (!room) return out;
    for (const ex of (room.exits || [])) {
      if (!DIRS.includes(ex.dir)) continue;
      const blocked = (ex.condition && !this.test(ex.condition)) ||
                      (ex.door && !this.isOpen(ex.door));
      if (blocked) {
        if (!ex.hidden) out[ex.dir] = false;
      } else {
        out[ex.dir] = ex.to;
      }
    }
    return out;
  }

  flagsOf(id) {
    const thing = this.items[id] || this.actors[id] || {};
    const a = Object.assign({}, thing.attributes);
    if (this.flags['_open_' + id] !== undefined) a.OPENBIT = !!this.flags['_open_' + id];
    if (this.flags['_lit_' + id] !== undefined) a.ONBIT = !!this.flags['_lit_' + id];
    return a;
  }

  /** Is this thing somewhere the player could look at it? */
  visibleHere(id) {
    if (this.loc[id] === 'PLAYER' || this.loc[id] === this.here) return true;
    if (this.actorLoc[id] === this.here) return true;
    const where = this.loc[id];
    return !!(where && this.items[where] && this.loc[where] === this.here && this.isOpen(where));
  }

  isOpen(id) {
    if (this.flags['_open_' + id] !== undefined) return !!this.flags['_open_' + id];
    const it = this.items[id] || {};
    return !!(it.attributes && (it.attributes.OPENBIT || it.attributes.TRANSPARENT));
  }

  isLit(id) {
    if (this.flags['_lit_' + id] !== undefined) return !!this.flags['_lit_' + id];
    const it = this.items[id] || {};
    return !!(it.attributes && it.attributes.ONBIT);
  }

  isDark() {
    const room = this.rooms[this.here] || {};
    if (!room.dark) return false;
    // A lit light source in the room or carried defeats the dark.
    for (const id of Object.keys(this.loc)) {
      const it = this.items[id];
      if (!it || !it.attributes || !it.attributes.LIGHTSOURCE) continue;
      if (!this.isLit(id)) continue;
      if (this.loc[id] === 'PLAYER' || this.loc[id] === this.here) return false;
    }
    return true;
  }

  lampTurns() {
    const lamp = Object.keys(this.items).find(id =>
      this.items[id].attributes && this.items[id].attributes.LIGHTSOURCE &&
      this.items[id].fuel !== undefined);
    if (!lamp) return null;
    const used = this.flags['_fuelUsed_' + lamp] || 0;
    return Math.max(0, this.items[lamp].fuel - used);
  }

  // ---------------------------------------------------------------- command
  /**
   * Submit a command. Returns verbatim authored prose plus the new state.
   * Rules are consulted first; the engine's default responses only speak when no
   * rule matched, so authors write the interesting cases and nothing else.
   */
  submit(verb, noun, indirect) {
    if (this.ended) return { prose: this.endText(), state: this.state() };
    verb = String(verb || '').toUpperCase();
    noun = noun ? String(noun).toUpperCase() : null;

    indirect = indirect ? String(indirect).toUpperCase() : null;

    let prose = null;
    for (const rule of this.rules) {
      if (!this.matches(rule, verb, noun, indirect)) continue;
      if (rule.if && !rule.if.every(c => this.test(c))) continue;
      prose = this.apply(rule.do || []);
      break;
    }
    if (prose === null) prose = this.builtin(verb, noun);

    this.moves++;
    const timed = this.tickTimers();
    if (timed) prose += '\n\n' + timed;
    if (this.ended) prose += '\n\n' + this.endText();

    this.log.push({ verb, noun, prose });
    return { prose, state: this.state() };
  }

  matches(rule, verb, noun, indirect) {
    const on = rule.on || {};
    // An arrival rule is dispatched by fireEnter and nowhere else. Every other
    // field here is optional, so without this an enter rule matched the first
    // command of any kind and answered everything in the game.
    if (on.enter) return false;
    if (on.verb && String(on.verb).toUpperCase() !== verb) return false;
    if (on.noun && String(on.noun).toUpperCase() !== noun) return false;
    if (on.room && on.room !== this.here) return false;
    // Two-object interactions: USE KEY ON DOOR, PUT EGG IN CASE.
    //
    // The board has always had this. TWO_OBJ marks USE and HIT as taking a
    // second target, so the interface asks the player to click another thing and
    // sends it. matches() then dropped it on the floor, and no rule could ever
    // name it, so the player picked two objects and the game said nothing. The
    // central MacVenture gesture was wired up at both ends and connected to
    // nothing in the middle.
    if (on.second && String(on.second).toUpperCase() !== indirect) return false;
    // A rule with no `second` must not swallow a two-object command, or the
    // one-object fallback fires first and the specific pairing never runs.
    if (!on.second && indirect) return false;
    return true;
  }

  /** Closed condition vocabulary — everything the validator must reason about. */
  test(c) {
    switch (c.type) {
      case 'flag': return !!this.flags[c.flag] === (c.value === undefined ? true : !!c.value);
      case 'carrying': return this.loc[c.item] === 'PLAYER';
      case 'in-room': return this.loc[c.item] === this.here;
      case 'present': return this.loc[c.item] === 'PLAYER' || this.loc[c.item] === this.here;
      case 'at': return this.here === c.room;
      case 'visited': return this.visited.has(c.room);
      case 'open': return this.isOpen(c.item);
      case 'lit': return this.isLit(c.item);
      case 'score-at-least': return this.score >= c.value;
      case 'counter-at-least': return (this.counters[c.counter] || 0) >= c.value;
      case 'counter-equals': return (this.counters[c.counter] || 0) === c.value;
      case 'actor-here': return this.actorLoc[c.actor] === this.here;
      case 'fighting': return Object.keys(this.actorLoc).some(id =>
        this.actorLoc[id] === this.here && this.actors[id] && this.actors[id].hostile);
      case 'not': return !this.test(c.condition);
      // Boolean composition. Only `not` nested before, so an author needing OR
      // had to mirror it into a flag by hand and keep the two in step.
      case 'all': return (c.conditions || []).every(x => this.test(x));
      case 'any': return (c.conditions || []).some(x => this.test(x));
      default: return false;
    }
  }

  /** Closed effect vocabulary. No scripting; a .folio can contain no code. */
  apply(effects) {
    const said = [];
    for (const e of effects) {
      switch (e.type) {
        case 'print': said.push(e.text); break;
        case 'set-flag': this.flags[e.flag] = e.value === undefined ? true : e.value; break;
        case 'move-item': this.loc[e.item] = e.to; break;
        case 'take': this.loc[e.item] = 'PLAYER'; break;
        case 'destroy': this.loc[e.item] = 'NOWHERE'; break;
        case 'open': this.flags['_open_' + e.item] = true; break;
        case 'close': this.flags['_open_' + e.item] = false; break;
        case 'light': this.flags['_lit_' + e.item] = true; break;
        case 'extinguish': this.flags['_lit_' + e.item] = false; break;
        case 'goto': this.here = e.room; this.visited.add(e.room); break;   // arrival fires via goTo
        case 'score': this.score += e.value; break;
        case 'set-counter': this.counters[e.counter] = e.value; break;
        case 'add-counter':
          this.counters[e.counter] = (this.counters[e.counter] || 0) + e.value; break;
        case 'move-actor': this.actorLoc[e.actor] = e.to; break;
        case 'win': this.ended = { win: true, reason: e.text || 'You have won.' }; break;
        case 'lose': this.ended = { win: false, reason: e.text || 'You have died.' }; break;
        default: break;   // unknown effects are inert; T1 rejects them at validation
      }
    }
    return said.join('\n');
  }

  tickTimers() {
    const fired = [];
    for (const t of this.timers) {
      if (t.done) continue;
      if (t.startFlag && !this.flags[t.startFlag]) continue;
      // A countdown you cannot defeat is a cutscene. Without a stop condition
      // the most Verne-appropriate mechanic in the book, dying of thirst unless
      // you find water, was unwritable: a lose inside a timer could not be
      // cancelled or guarded by any means the format offered.
      if (t.stopFlag && this.flags[t.stopFlag]) { t.done = true; continue; }
      if (t.if && !t.if.every(c => this.test(c))) continue;
      t.elapsed++;
      if (t.fuelFor) this.flags['_fuelUsed_' + t.fuelFor] = t.elapsed;
      if (t.elapsed >= t.turns) {
        t.done = !t.repeat;
        if (!t.repeat) t.elapsed = 0;
        const text = this.apply(t.do || []);
        if (text) fired.push(text);
      }
    }
    return fired.join('\n');
  }

  /**
   * Move the player, then let the room react to their arrival.
   *
   * Nothing could happen BECAUSE the player arrived somewhere: every consequence
   * had to hang off a verb, so a floor that gives way when you step on it, or an
   * ambush, or a door closing behind you, were all unwritable. That is a large
   * part of what an adventure does to you rather than for you.
   */
  goTo(dest, depth) {
    this.here = dest;
    this.visited.add(dest);
    let text = this.describe();
    const extra = this.fireEnter(dest, depth || 0);
    return extra ? text + '\n\n' + extra : text;
  }

  fireEnter(room, depth) {
    if (depth > 8) return '';         // an entry rule that walks you onward
    for (const rule of this.rules) {
      const on = rule.on || {};
      if (on.enter !== room) continue;
      if (rule.if && !rule.if.every(c => this.test(c))) continue;
      const before = this.here;
      const said = this.apply(rule.do || []);
      // If the rule moved the player on, describe where they ended up.
      if (this.here !== before) {
        return said + (said ? '\n\n' : '') + this.goTo(this.here, depth + 1);
      }
      return said;
    }
    return '';
  }

  endText() {
    return this.ended ? this.ended.reason : '';
  }

  /** Default responses. Tone is configurable so authors only write what matters. */
  builtin(verb, noun) {
    const room = this.rooms[this.here] || {};
    const tone = (this.def.meta && this.def.meta.defaults) || {};
    if (DIRS.includes(verb)) {
      const dest = this.exits()[verb];
      if (!dest) {
        // A refusal that belongs to the passage rather than to the whole game.
        // One global `blocked` string was shown for a locked gate in Hamburg and
        // a granite wall thirty leagues under the Atlantic, and the only way to
        // say anything specific was a guarded rule sitting above every exit.
        const ex = ((room.exits || []).find(x => x.dir === verb) || {});
        return ex.blocked || tone.blocked || 'You cannot go that way.';
      }
      return this.goTo(dest);
    }
    switch (verb) {
      case 'LOOK': {
        // LOOK with a noun is EXAMINE. It used to ignore the noun entirely and
        // re-describe the room, so clicking LOOK on an object told you about the
        // floor, and inspecting anything had to be hand-rolled as a USE rule,
        // which then counted the object as load-bearing.
        if (!noun) return this.describe();
        const it = this.items[noun] || this.actors[noun];
        if (!it) return tone.absent || 'You do not see that here.';
        if (!this.visibleHere(noun)) return tone.absent || 'You do not see that here.';
        return it.description || tone.plain ||
          ('You see nothing special about the ' + (it.name || String(noun).toLowerCase()) + '.');
      }
      // Letting a turn go by is a move in its own right, and every parser since
      // 1977 has had it. LOOK passed a turn as a side effect, which is not the
      // same as being able to say "I wait".
      case 'WAIT': case 'Z': return tone.wait || 'Time passes.';
      case 'TAKE': {
        if (!noun) return tone.what || 'Take what?';
        if (this.loc[noun] === 'PLAYER') return tone.already || 'You already have that.';
        if (this.loc[noun] !== this.here) return tone.absent || 'You do not see that here.';
        const it = this.items[noun] || {};
        if (!(it.attributes && it.attributes.TAKEBIT)) return tone.fixed || 'That is not something you can carry.';
        this.loc[noun] = 'PLAYER';
        return tone.taken || 'Taken.';
      }
      case 'DROP':
        if (this.loc[noun] !== 'PLAYER') return tone.nothave || 'You are not carrying that.';
        this.loc[noun] = this.here;
        return tone.dropped || 'Dropped.';
      case 'OPEN':
        if (!this.items[noun]) return tone.absent || 'You do not see that here.';
        if (this.isOpen(noun)) return tone.alreadyOpen || 'It is already open.';
        return tone.locked || 'It will not open.';
      case 'INVENTORY': {
        const inv = Object.keys(this.loc).filter(i => this.loc[i] === 'PLAYER');
        if (!inv.length) return tone.empty || 'You are empty-handed.';
        return 'You are carrying:\n' + inv.map(i => '  ' + ((this.items[i] || {}).name || i)).join('\n');
      }
      default:
        return tone.unknown || 'Nothing happens.';
    }
  }

  describe() {
    if (this.isDark()) {
      return (this.def.meta && this.def.meta.defaults && this.def.meta.defaults.dark) ||
        'It is pitch black.';
    }
    const room = this.rooms[this.here] || {};
    const here = Object.keys(this.loc).filter(i => this.loc[i] === this.here);
    // A room that reads the same before and after everything that happens in it
    // is a backdrop rather than a place. Variants are tried in order and the
    // first whose conditions hold wins, falling back to `prose`.
    //
    // Without this the only dynamic room text was an item's roomProse, so an
    // author wanting a hall to change once the ogre wakes had to park scenery in
    // NOWHERE and move it in. That trick worked and nothing had taught it, which
    // is a sign the format was missing something rather than that the author was
    // clever.
    let body = room.prose || '';
    for (const v of (room.variants || [])) {
      if ((v.if || []).every(c => this.test(c))) { body = v.prose; break; }
    }
    let out = (room.name || this.here) + '\n' + body;
    for (const id of here) {
      const it = this.items[id];
      if (it && it.roomProse) out += '\n' + it.roomProse;
    }
    return out;
  }
}

function index(list) {
  const out = {};
  for (const x of (list || [])) out[x.id] = x;
  return out;
}

// Small deterministic PRNG. Determinism is not a nicety here: walkthrough replay,
// the blind solver, and every regression transcript depend on identical runs.
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Create a Path B backend. Mirrors @folio/zmachine's createBackend shape. */
function createBackend(worldJson, opts) {
  // Accept a string, raw bytes (Buffer in node, Uint8Array in a browser), or an
  // already-parsed object. The engine has to run in a page with no build step, so
  // it cannot assume Buffer exists.
  let def = worldJson;
  if (typeof worldJson === 'string') {
    def = JSON.parse(worldJson);
  } else if (worldJson && typeof worldJson.byteLength === 'number') {
    def = JSON.parse(new TextDecoder().decode(worldJson));
  }
  if (!def || !def.meta || !def.meta.start) {
    throw new Error('@folio/world: world.json needs meta.start');
  }
  const w = new World(def, opts);
  return {
    world: w,
    banner: (def.meta.title || 'Untitled') + '\n\n' + w.describe(),
    state: () => w.state(),
    submit: (verb, noun, indirect) => w.submit(verb, noun, indirect)
  };
}

if (typeof module !== 'undefined' && module.exports) module.exports = { createBackend, World };
if (typeof window !== 'undefined') { window.FolioWorld = { createBackend, World }; }

//  Path B, rendered by the real shell.
//
//  The shell was written against a Z-machine and reads three globals to do its
//  work: an interpreter, a bridge that projects the world, and a verb map that
//  turns a click into a command. Rewriting 1,500 lines of tuned interface code to
//  take a backend parameter would risk every pixel of a layout that works, so this
//  presents a declarative world THROUGH those same interfaces instead.
//
//  The surface the shell actually touches is small, which is what makes the
//  adapter viable rather than a second implementation:
//
//    interpreter   start · input · snapshot · restore · getGlobal
//    bridge        init · state · lampFraction
//    verb map      noun · command · needsSecond · magicWords
//
//  Everything else the shell does — scenes, hit testing, the inventory strip, the
//  save UI, the portrait board — already runs off the World State Contract, so it
//  works unchanged the moment `state()` returns something sensible.
//
//  This is a bridge in the temporary sense. The shell becomes properly
//  backend-agnostic when it accepts a contract-speaking object directly, and at
//  that point this file deletes itself. Until then it is honest about what it is.

(function (root) {
  'use strict';

  var World = (root.FolioWorld && root.FolioWorld.World) || null;

  /**
   * Install a Path B world into the globals the shell reads.
   * @param {object} def  a parsed world.json

  function install(def, opts) {
    opts = opts || {};

    // ---- the interpreter shim ------------------------------------------------
    // Constructed the way the shell constructs a Z-machine, so boot() needs no
    // special case: `new GUE.ZMachine(story)` works and the story argument is
    // ignored, since a world carries its own definition.
    function WorldMachine() {
      world = new World(def, { seed: opts.seed === undefined ? 1234 : opts.seed });
      this.world = world;
    }

    WorldMachine.prototype.start = function () {
      return (def.meta && def.meta.title ? def.meta.title + '\n\n' : '') + world.describe();
    };

    // The shell hands over a whole typed line; the world engine wants verb and
    // noun. Splitting here keeps that difference in one place.
    WorldMachine.prototype.input = function (line) {

        loc: JSON.parse(JSON.stringify(world.loc)),

//  and looked nothing like the game.

//  the parts that belong to a game rather than to the engine: the story, the

//  The shell still boots itself from globals — it was written for a page with
